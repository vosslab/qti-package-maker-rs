[workspace]
members = ["crates/qti-core", "crates/qti-render", "crates/qti-integrity", "crates/qti-engines", "crates/qti-native", "crates/qti-cli", "crates/qti-molecule", "crates/qti-wasm", "xtask"]
default-members = ["crates/qti-core", "crates/qti-render", "crates/qti-integrity", "crates/qti-engines", "crates/qti-native", "crates/qti-cli", "crates/qti-molecule", "xtask"]
resolver = "3"

[workspace.package]
version = "26.10.0"
repository = "https://github.com/vosslab/qti-package-maker-rs"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
chromiumoxide = "*"
futures = "*"
tokio = { version = "*", features = ["rt-multi-thread"] }
time = { version = "*", features = ["local-offset"] }
clap = { version = "*", features = ["derive"] }
serde = { version = "*", features = ["derive"] }
thiserror = "*"
crc = "*"
regex = "*"
serde_json = { version = "*", features = ["float_roundtrip"] }
quick-xml = "*"
# Keep HTML parse diagnostics without scraper's standalone command-line tool.
scraper = { version = "*", default-features = false, features = ["errors"] }
markup5ever = "*"
indexmap = "*"
tempfile = "*"
sha2 = "*"
lol_html = "*"
serde_yaml_ng = "*"
base64 = "*"
fastrand = { version = "*", default-features = false }
png = "*"
percent-encoding = "*"
rayon = "*"
# All writers use ordinary Deflate; the optional Zopfli encoder is unused.
zip = { version = "*", default-features = false, features = ["deflate-flate2-zlib-rs"] }
