[package]
name = "qti-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed browser adapter for shared QTI conversion and integrity checks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qti-core = { path = "../qti-core" }
qti-engines = { path = "../qti-engines" }
qti-integrity = { path = "../qti-integrity" }
serde.workspace = true
serde_bytes = "*"
tsify = { version = "*", default-features = false, features = ["js"] }
wasm-bindgen = "*"
js-sys = "*"

[dev-dependencies]
serde_json.workspace = true
